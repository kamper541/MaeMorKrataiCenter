openapi: 3.1.0
info:
  title: MaeMorKratai Admin Backend API
  version: 0.2.0
  description: |
    Infrastructure, health, JWKS, and Day-1 authentication contract for backend-admin
    (SPEC-001). All endpoints enforce deny-by-default authorization except explicitly
    documented public auth and health routes.

    SPEC-002 adds master-data management (`tag: master-data`):
    - Every master-data endpoint requires a bearer token with role `admin` or higher
      and an active account.
    - Every response is `Cache-Control: no-store`. GETs here are uncached and return
      the same shapes the writes accept, so a record can be read, edited and PUT back.
      The public client API may lag up to 10 minutes (D05).
    - PUT replaces the whole record; keys are immutable (body key must equal the path
      key); concurrent writes are last-write-wins (D06).
    - References are checked atomically with the write: a missing card, category or
      love-status key is 400 `INVALID_REFERENCE`; deleting a record that is still
      referenced is 409 (delete dependents first, no cascade) (D09). Exception:
      deleting a category moves its situations and suggestions to uncategorized
      (category null) instead (D10).
    - Every create/update/delete writes an `audit_events` row
      (`master_data.<entity>.<action>`, record key, changed field names; no text values).
    - Any daily entry, daily metadata or love-status write sets daily `updated` to today
      (Asia/Bangkok) and the trailing date of `version` (appended if missing).
    - Validation: unknown JSON fields are rejected with 400; text is plain text (no
      control characters except newline); short text 1-200 characters, long text
      (`details`, daily content) 1-2,000; body at most 64 KiB (413).
    - Shared schemas are referenced from `../client/openapi.yaml`.
servers:
  - url: http://127.0.0.1:8787
    description: Local Wrangler dev
  - url: https://admin-api-staging.maemorkratai.com
    description: Staging environment
  - url: https://admin-api.maemorkratai.com
    description: Production environment
paths:
  /health:
    get:
      summary: Service health check
      operationId: getHealth
      responses:
        "200":
          description: D1 and R2 bindings healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: One or more bindings unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /.well-known/jwks.json:
    get:
      summary: Public JSON Web Key Set (active and retiring keys)
      operationId: getJwks
      responses:
        "200":
          description: Public JWKS document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwksDocument"
  /v1/auth/login:
    post:
      summary: Authenticate admin or owner user
      operationId: postLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Access token issued and HttpOnly refresh cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Malformed payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Inactive account or insufficient role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/auth/refresh:
    post:
      summary: Rotate refresh cookie and issue new access JWT
      operationId: postRefresh
      parameters:
        - in: header
          name: X-CSRF-Protection
          required: true
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: New access token issued and refresh cookie rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Invalid, expired, or replayed refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Disallowed Origin or missing CSRF header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/auth/logout:
    post:
      summary: Revoke current refresh session and clear cookie
      operationId: postLogout
      parameters:
        - in: header
          name: X-CSRF-Protection
          required: true
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    example: logged_out
        "403":
          description: Disallowed Origin or missing CSRF header
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/me:
    get:
