          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/positions:
    post:
      summary: Create a spread position
      operationId: createPosition
      tags: [master-data]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PositionWrite"
      responses:
        "201":
          description: "OK (`Cache-Control: no-store`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionWrite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/positions/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema:
          $ref: "../client/openapi.yaml#/components/schemas/Key"
    put:
      summary: Replace a spread position (last write wins, D06)
      operationId: updatePosition
      tags: [master-data]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PositionWrite"
      responses:
        "200":
          description: "OK (`Cache-Control: no-store`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PositionWrite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      summary: Delete a spread position
      operationId: deletePosition
      tags: [master-data]
      security:
        - BearerAuth: []
      responses:
        "204":
          description: "Deleted (`Cache-Control: no-store`)"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/love-statuses:
    post:
      summary: Create a love status (bumps daily version)
      operationId: createLoveStatus
      tags: [master-data]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoveStatusWrite"
      responses:
        "201":
          description: "OK (`Cache-Control: no-store`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoveStatusWrite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/love-statuses/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema:
          $ref: "../client/openapi.yaml#/components/schemas/Key"
    put:
      summary: Replace a love status (bumps daily version) (last write wins, D06)
      operationId: updateLoveStatus
      tags: [master-data]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoveStatusWrite"
      responses:
        "200":
          description: "OK (`Cache-Control: no-store`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoveStatusWrite"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
    delete:
      summary: Delete a love status (bumps daily version). 409 while any stored card meaning/detail or daily love text uses its key. Bumps daily version.
      operationId: deleteLoveStatus
      tags: [master-data]
      security:
        - BearerAuth: []
      responses:
        "204":
          description: "Deleted (`Cache-Control: no-store`)"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  responses:
    BadRequest:
      description: >
        Validation failed; nothing changed. Codes: `VALIDATION_FAILED` (unknown field,
        wrong type, missing field, length, pattern, integer bounds, control characters,
        PUT body key differs from path key, situation with category `love`, art entry
        `art` differs from its card) or `INVALID_REFERENCE` (card, category or
        love-status key does not exist).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    PayloadTooLarge:
      description: Body exceeds MAX_BODY_BYTES (65,536); code `PAYLOAD_TOO_LARGE`; nothing changed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Role below `admin` or inactive account
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Record does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Key already exists (create), or record is still referenced (delete); nothing changed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unavailable:
      description: D1 unavailable or a statement in the write batch failed; nothing persisted (no change, no audit row, no daily version bump)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthResponse:
      type: object
      required: [status, d1, r2]
      properties:
        status:
          type: string
          example: ok
        d1:
          type: string
          example: ok
        r2:
          type: string
          example: ok
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, role]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
        role:
          type: string
          enum: [owner, admin]
    MeResponse:
      type: object
      required: [id, email, role, is_active]
      properties:
        id:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [owner, admin]
        is_active:
          type: boolean
    RotateKeyResponse:
      type: object
      required: [kid, alg, status]
      properties:
        kid:
          type: string
        alg:
          type: string
          enum: [ES256]
        status:
          type: string
          enum: [active]
    PublicJwk:
      type: object
      required: [kty, alg, kid]
      properties:
        kty:
          type: string
        use:
          type: string
        alg:
          type: string
        kid:
          type: string
        crv:
          type: string
        x:
          type: string
        y:
          type: string
        n:
          type: string
        e:
          type: string
    JwksDocument:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: "#/components/schemas/PublicJwk"
    ErrorEnvelope:
      type: object
      required: [request_id, code, message]
      properties:
        request_id:
          type: string
        code:
          type: string
        message:
          type: string
    SortOrder:
      type: integer
      minimum: 0
      maximum: 10000
      description: Position in public lists (ascending)
    SuggestionId:
      type: string
      maxLength: 64
      description: Seeded suggestions use `<category>-<n>` (e.g. `love-1`); admin-created ones get a server-generated UUIDv4.
    CardWrite:
      description: >
        Public ReadingCard plus `sort_order`. On PUT, `id` must equal the path
        `card_id` (keys are immutable). Keys of `meanings` / `details` must be
        existing love-status keys; an omitted key or `null` means no text.
      allOf:
        - $ref: "../client/openapi.yaml#/components/schemas/ReadingCard"
        - type: object
          required: [sort_order]
          properties:
            sort_order:
              $ref: "#/components/schemas/SortOrder"
      unevaluatedProperties: false
    CardWriteList:
      type: array
      items:
        $ref: "#/components/schemas/CardWrite"
    DailyCardWrite:
      description: >
        Public DailyCard plus `sort_order` (daily order differs from card order).
        `card_id` must be an existing card; on PUT it must equal the path.
        `missing_fields` is computed by the server; it is optional and ignored on write.
      allOf:
        - $ref: "../client/openapi.yaml#/components/schemas/DailyCard"
        - type: object
          required: [sort_order]
          properties:
            sort_order:
              $ref: "#/components/schemas/SortOrder"
      unevaluatedProperties: false
    DailyMetadataWrite:
      type: object
      description: Editable daily metadata. `version` and `updated` are set by the server.
      required: [schema_version, status, scope, auto_fallback_to_general_or_spread]
      additionalProperties: false
      properties:
        schema_version:
          type: integer
          minimum: 1
        status:
          type: string
          minLength: 1
          maxLength: 200
        scope:
          type: string
          minLength: 1
          maxLength: 2000
        auto_fallback_to_general_or_spread:
          type: boolean
    DailyMetadata:
      allOf:
        - $ref: "#/components/schemas/DailyMetadataWrite"
        - type: object
          required: [version, updated]
          properties:
            version:
              type: string
              example: daily-v1-draft-2026-11-21
            updated:
              type: string
              format: date
    AdminDailyDocument:
      description: Daily metadata plus entries in write shape, ordered by `sort_order`.
      allOf:
        - $ref: "#/components/schemas/DailyMetadata"
        - type: object
          required: [cards]
          properties:
            cards:
              type: array
              items:
                $ref: "#/components/schemas/DailyCardWrite"
    CategoryWrite:
      description: On PUT, `key` must equal the path key (immutable).
      allOf:
        - $ref: "../client/openapi.yaml#/components/schemas/Category"
        - type: object
          required: [sort_order]
          properties:
            sort_order:
              $ref: "#/components/schemas/SortOrder"
      unevaluatedProperties: false
    SituationWrite:
      type: object
      description: >
        Situations for categories other than `love`. Love situations are the love
        statuses (manage them via `/v1/admin/love-statuses`); `category: love` is
        rejected with 400. `category` null means uncategorized (D10). On PUT, `key`
        must equal the path key; `category` may change to another existing category or null.
      required: [key, category, label, sort_order]
      additionalProperties: false
      properties:
        key:
          $ref: "../client/openapi.yaml#/components/schemas/Key"
        category:
          oneOf:
            - $ref: "../client/openapi.yaml#/components/schemas/Key"
            - type: "null"
        label:
          type: string
          minLength: 1
          maxLength: 200
        sort_order:
          $ref: "#/components/schemas/SortOrder"
    SuggestionWrite:
      type: object
      required: [category, text, sort_order]
      additionalProperties: false
      properties:
        category:
          description: Category key, or null for uncategorized (D10)
          oneOf:
            - $ref: "../client/openapi.yaml#/components/schemas/Key"
            - type: "null"
        text:
          type: string
          minLength: 1
          maxLength: 200
        sort_order:
          $ref: "#/components/schemas/SortOrder"
    SuggestionRecord:
      allOf:
        - $ref: "#/components/schemas/SuggestionWrite"
        - type: object
          required: [id]
          properties:
            id:
              $ref: "#/components/schemas/SuggestionId"
    PositionWrite:
      description: On PUT, `key` must equal the path key (immutable).
      allOf:
        - $ref: "../client/openapi.yaml#/components/schemas/LabeledKey"
        - type: object
          required: [sort_order]
          properties:
            sort_order:
              $ref: "#/components/schemas/SortOrder"
      unevaluatedProperties: false
    LoveStatusWrite:
      description: >
        Two orders because the daily and 3-card screens list statuses differently.
        On PUT, `key` must equal the path key (immutable). Any create, update or
        delete bumps the daily `updated` / `version`.
      allOf:
        - $ref: "../client/openapi.yaml#/components/schemas/LoveStatus"
        - type: object
          required: [daily_sort_order, reading_sort_order]
          properties:
            daily_sort_order:
              $ref: "#/components/schemas/SortOrder"
            reading_sort_order:
              $ref: "#/components/schemas/SortOrder"
      unevaluatedProperties: false
    AdminReadingConfig:
      type: object
      description: Reading config in write shapes, so each record can be read, edited and PUT back.
      required: [categories, situations, suggestions, positions, love_statuses]
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategoryWrite"
        situations:
          type: array
          description: Non-love situations only
          items:
            $ref: "#/components/schemas/SituationWrite"
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/SuggestionRecord"
        positions:
          type: array
          items:
            $ref: "#/components/schemas/PositionWrite"
        love_statuses:
          type: array
          items:
            $ref: "#/components/schemas/LoveStatusWrite"
